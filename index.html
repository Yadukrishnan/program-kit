<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Program Kit">
<meta name="theme-color" content="#8A1B2C">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Program Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Manjari:wght@400;700&family=Marcellus&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Serif+Malayalam:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column (max 640px) — sticky header with step tabs, big touch targets, sticky bottom action bar */
:root{
  --bg:#FBF8F7; --surface:#FFFFFF; --sunk:#F2ECEA; --ink:#26171B; --muted:#6C5A5F; --line:#E5DAD7;
  --accent:#8A1B2C; --accent-ink:#FFFFFF; --accent-soft:#F6E4E6; --gold:#9C7015; --ok:#2C6E47; --ok-soft:#E3F1E8; --warn:#8A5300; --warn-soft:#FBEFD9;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Inter","Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161012; --surface:#211A1C; --sunk:#2B2225; --ink:#F4EAEC; --muted:#BBA9AE; --line:#3B2F33;
  --accent:#E06A7D; --accent-ink:#1A0B0F; --accent-soft:#3A1E25; --gold:#DDB45A; --ok:#7CCB98; --ok-soft:#1E3327; --warn:#F0B35A; --warn-soft:#3A2B14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161012; --surface:#211A1C; --sunk:#2B2225; --ink:#F4EAEC; --muted:#BBA9AE; --line:#3B2F33;
  --accent:#E06A7D; --accent-ink:#1A0B0F; --accent-soft:#3A1E25; --gold:#DDB45A; --ok:#7CCB98; --ok-soft:#1E3327; --warn:#F0B35A; --warn-soft:#3A2B14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem}
h2{font-size:1.35rem}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{padding-block:10px 8px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand-name{font-family:var(--display);font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand-name svg{color:var(--gold)}
.chip{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.chip.live{background:var(--ok-soft);color:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.steps button{border:0;background:var(--sunk);border-radius:10px;min-height:52px;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;min-width:0}
.steps button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;background:var(--line);color:var(--ink)}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
.steps button[aria-current="step"] .n{background:var(--accent-ink);color:var(--accent)}

main{padding-block:20px 140px}
.lead{display:flex;flex-direction:column;gap:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1.05rem;text-decoration:none;text-align:center}
.btn.secondary{background:var(--sunk);color:var(--ink)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wa{background:#1F8F4E;color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:46px;font-size:.95rem;padding:0 16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row.one{grid-template-columns:1fr}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn[disabled]{opacity:.35}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--muted);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.sm button{min-height:38px;font-size:.88rem}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl > .lbl{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* step 1 */
.prog{display:flex;flex-direction:column;gap:10px}
.pi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.num{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.pi-main{min-width:0}
.pi-title{font-weight:600;line-height:1.3}
.pi-meta{font-size:.88rem;color:var(--muted)}
.pi-ctrl{display:flex;gap:6px}
.pi{position:relative;transition:background-color .5s ease, box-shadow .5s ease}
.pi.moved{z-index:2;background:var(--accent-soft);box-shadow:0 0 0 2.5px var(--accent),0 10px 24px rgba(0,0,0,.14)}
.pi.moved .num{animation:numPop .5s ease}
.pi.appear{animation:piIn .45s cubic-bezier(.2,.7,.2,1)}
.pi.leaving{animation:piOut .26s ease-in forwards;pointer-events:none}
@keyframes piIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes piOut{to{opacity:0;transform:translateX(40px)}}
@keyframes numPop{40%{transform:scale(1.25)}}
.total{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.95rem;color:var(--muted);padding:2px 4px}
.total b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rr{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.rr:last-child{border-bottom:0}
.rr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rr-type{font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.rr-title{font-weight:600}
.rr-meta{font-size:.88rem;color:var(--muted)}
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,112px));z-index:3;background:var(--bg);padding-block:6px}
.search-in{position:relative}
.search-in svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-in input{width:100%;min-height:54px;font-size:1.08rem;padding:10px 52px 10px 46px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.search-in input:focus{border-color:var(--accent);outline:none}
.search-in .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);display:grid;place-items:center}
.count{font-size:.88rem;color:var(--muted);padding:6px 4px 0}
.rr-add{flex:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:999px;font-size:.95rem}

/* fields */
.field{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field > label,.field > .flabel{font-weight:600}
.field .opt{font-weight:400;color:var(--muted);font-size:.9rem}
.inp{position:relative}
.inp input{width:100%;min-height:52px;font-size:1.05rem;padding:10px 14px 10px 54px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.inp input:focus{border-color:var(--accent);outline:none}
.inp .tag{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--muted);background:var(--sunk);border-radius:6px;padding:3px 6px}
.inp.plain input{padding-left:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{min-width:0}
.ml{font-family:"Noto Sans Malayalam","Manjari",var(--body)}
.hint{font-size:.88rem;color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn-row{max-width:640px;margin:0 auto}

/* ready */
.summary{padding:16px;border-radius:var(--r);background:var(--accent-soft);display:flex;flex-direction:column;gap:4px}
.summary .ev{font-family:var(--display);font-size:1.3rem;line-height:1.25}
.summary .sm{font-size:.95rem;color:var(--muted)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,112px));z-index:4;background:var(--bg);padding-block:8px}
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.95rem}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:.95rem}

.files{display:flex;flex-direction:column}
.file{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.file:last-child{border-bottom:0}
.file .fn{min-width:0;overflow-wrap:anywhere}
.file .du{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.progress{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tips{display:flex;flex-direction:column;gap:10px;font-size:.95rem}
.tips div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.tips b{color:var(--ink)}
.tips .k{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--gold)}
.linkbox{font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--sunk);overflow-wrap:anywhere;user-select:all}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:1.12rem;font-family:var(--body);font-weight:700}
.sec-h .seg{flex:none;width:170px}
.part{display:flex;flex-direction:column;gap:4px}
.part .pl{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.part textarea{width:100%;border:1.5px solid transparent;border-radius:10px;background:var(--sunk);padding:12px;font-size:1.02rem;line-height:1.6;resize:none;overflow:hidden;min-height:60px}
.part textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.part textarea.ml{font-size:1.05rem;line-height:1.8}
.edited{font-size:.75rem;color:var(--gold);font-weight:600}

.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ph{flex:none;width:76px;height:96px;border-radius:12px;border:3px solid transparent;padding:0;overflow:hidden;background:var(--sunk);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph[aria-pressed="true"]{border-color:var(--accent)}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.78rem;font-weight:600;color:var(--accent);border:2px dashed var(--accent);background:var(--accent-soft)}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.stage{display:flex;flex-direction:column;gap:8px}
.stage-h{display:flex;flex-direction:column}
.stage-h b{font-size:1.05rem}
.stage-h span{font-size:.9rem;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:1fr .5625fr;gap:10px;align-items:start}
/* poster carousel: English post, English story, Malayalam post, Malayalam story — swipe sideways */
.car{--ch:min(280px,62vw);display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:0;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car .tw{flex:none;scroll-snap-align:start;height:var(--ch)}
.car .tw.sq{width:var(--ch)}
.car .tw.story{width:calc(var(--ch) * .5625)}
.car .thumb{height:100%}
.car .thumb canvas{width:100%;height:100%}
.dots{display:flex;justify-content:center;gap:4px}
.dots button{width:26px;height:26px;padding:0;border:0;background:transparent;display:grid;place-items:center}
.dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:background-color .2s, transform .2s}
.dots button[aria-current="true"]::before{background:var(--accent);transform:scale(1.25)}
.keepopen{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.98rem;font-weight:600}
.thumb{border:0;padding:0;background:var(--sunk);border-radius:10px;overflow:hidden;display:block;width:100%;position:relative}
.thumb canvas{width:100%;height:auto;display:block}
.tw{position:relative;min-width:0}
.dl{position:absolute;top:6px;right:6px;width:42px;height:42px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(20,10,12,.68);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.dl[disabled]{opacity:.6}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h2{font-size:1.3rem}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sthumb{border:1px solid var(--line);padding:0;background:#FFFFFF;border-radius:8px;overflow:hidden;display:block;width:100%;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sthumb canvas{width:100%;height:auto;display:block}
.sthumb .chg{position:absolute;top:5px;right:5px;font-size:.66rem;font-weight:700;background:var(--gold);color:#FFFFFF;padding:2px 6px;border-radius:6px}
.btn-row.save-row{grid-template-columns:1fr 2.2fr}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb .cap,.sthumb .cap{position:absolute;left:6px;bottom:6px;font-size:.7rem;font-weight:700;background:rgba(0,0,0,.6);color:#fff;padding:3px 7px;border-radius:6px;letter-spacing:.03em}

/* viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.viewer .wrap{display:flex;flex-direction:column;gap:14px}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.v-top b{font-size:1.05rem}
.v-stage{display:flex;justify-content:center;background:var(--sunk);border-radius:var(--r);padding:10px}
.v-stage img,.v-stage canvas{max-width:100%;max-height:62vh;width:auto;height:auto;display:block;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.v-stage canvas{touch-action:none;cursor:grab}
.v-stage{position:relative}
.vmove{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:rgba(20,10,12,.7);color:#FFFFFF;font-size:.88rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.zoom{display:flex;align-items:center;gap:12px}
.zoom input{flex:1;accent-color:var(--accent);height:36px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.two{grid-template-columns:1fr}.sec-h .seg{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top" id="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="brand-name">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c1.8 2.6 2.7 4.6 2.7 6.1A2.7 2.7 0 0 1 12 10.8a2.7 2.7 0 0 1-2.7-2.7C9.3 6.6 10.2 4.6 12 2Zm-7 10h14v1.6c0 1-.8 1.9-1.9 1.9h-3.4v3.3h2.6V21H7.7v-2.2h2.6v-3.3H6.9C5.8 15.5 5 14.6 5 13.6V12Z"/></svg>
        <span>Program Kit</span>
      </div>
      <span class="chip" id="modeChip">Sample data</span>
    </div>
    <nav class="steps" aria-label="Steps">
      <button data-act="go" data-step="1"><span class="n">1</span>Items</button>
      <button data-act="go" data-step="2"><span class="n">2</span>Details</button>
      <button data-act="go" data-step="3"><span class="n">3</span>Posters</button>
      <button data-act="go" data-step="4"><span class="n">4</span>Script</button>
      <button data-act="go" data-step="5"><span class="n">5</span>Review</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>
<div class="bar" id="bar"><div class="wrap"><div class="btn-row" id="barRow"></div></div></div>

<div class="viewer" id="viewer" hidden>
  <div class="wrap">
    <div class="v-top"><b id="vTitle">Poster</b><button class="btn sm secondary" id="vClose" data-act="vclose">Done</button></div>
    <div class="v-stage" id="vStage">
      <img id="vImg" alt="Poster preview">
      <canvas id="vCanvas" hidden aria-label="Drag to move the photo"></canvas>
      <button class="vmove" id="vMove" data-act="vadjust"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>Move photo</button>
    </div>
    <div id="vTools" class="stack-sm"></div>
  </div>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function isoPlusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function secs(dur){ if(!dur) return 0; const p=String(dur).trim().split(':').map(Number); if(p.some(isNaN)) return 0; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : p[0]*60; }
function fmtDur(s){ if(!s) return ''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h ? `${h}:${pad2(m)}:${pad2(x)}` : `${m}:${pad2(x)}`; }
function fmtLong(s){ const m=Math.round(s/60); if(m<60) return `${m} min`; const h=Math.floor(m/60), r=m%60; return r ? `${h} hr ${r} min` : `${h} hr`; }

const EN_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EN_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ML_DAYS=['ഞായറാഴ്ച','തിങ്കളാഴ്ച','ചൊവ്വാഴ്ച','ബുധനാഴ്ച','വ്യാഴാഴ്ച','വെള്ളിയാഴ്ച','ശനിയാഴ്ച'];
const ML_MON=['ജനുവരി','ഫെബ്രുവരി','മാർച്ച്','ഏപ്രിൽ','മേയ്','ജൂൺ','ജൂലൈ','ഓഗസ്റ്റ്','സെപ്റ്റംബർ','ഒക്ടോബർ','നവംബർ','ഡിസംബർ'];
function parseDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function fmtDate(s, lang){ const d=parseDate(s); if(!d) return '';
  return lang==='ml' ? `${d.getFullYear()} ${ML_MON[d.getMonth()]} ${d.getDate()}, ${ML_DAYS[d.getDay()]}`
                     : `${EN_DAYS[d.getDay()]}, ${d.getDate()} ${EN_MON[d.getMonth()]} ${d.getFullYear()}`; }
function fmtShortDate(s){ const d=parseDate(s); return d ? `${d.getDate()} ${EN_MON[d.getMonth()].slice(0,3)} ${d.getFullYear()}` : ''; }
function hourOf(t){ const m=/^(\d{1,2}):/.exec(t||''); return m ? +m[1] : 18; }
function fmtTime(t, lang){ const m=/^(\d{1,2}):(\d{2})/.exec(t||''); if(!m) return ''; const h=+m[1], mm=m[2], h12=((h+11)%12)+1;
  if(lang==='ml'){ const p = h<12?'രാവിലെ' : h<16?'ഉച്ചയ്ക്ക്' : h<19?'വൈകുന്നേരം' : 'രാത്രി'; return `${p} ${h12}:${mm}`; }
  return `${h12}:${mm} ${h<12?'AM':'PM'}`; }

/* fill a template: {key} placeholders; [[ ... ]] parts are dropped when any placeholder inside is empty */
function fill(tpl, v){
  if(!tpl) return '';
  let s = String(tpl).replace(/\[\[([\s\S]*?)\]\]/g, (m, inner) => {
    const keys = [...inner.matchAll(/\{(\w+)\}/g)].map(x=>x[1]);
    return keys.every(k => v[k] && String(v[k]).trim()) ? inner : '';
  });
  s = s.replace(/\{(\w+)\}/g, (m,k) => v[k]!=null ? v[k] : '');
  return s.replace(/[ \t]{2,}/g,' ').replace(/[ \t]+([.,])/g,'$1').trim();
}

/* ---------------- toast & clipboard ---------------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove();
  toast(ok ? 'Copied. Paste it anywhere.' : 'Copy did not work here. Press and hold the text to copy it.');
}
const waHref = text => 'https://wa.me/?text=' + encodeURIComponent(text);
let dlP = null;
function getDownloads(){ if(dlP) return dlP; dlP = (window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null); return dlP; }
async function shareFile(blob, filename, fallbackMsg){
  const file = new File([blob], filename, {type: blob.type});
  if(navigator.canShare && navigator.share){ try{ if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; } }catch(e){ if(e && e.name==='AbortError') return true; } }
  const dl = await getDownloads();
  if(dl){ try{ await dl.save({filename, data: blob}); return true; }catch(e){ if(e && e.code==='declined') return true; } }
  if(fallbackMsg) toast(fallbackMsg);
  return false;
}

/* ---------------- API (real version) ---------------- */
async function api(action, params, body){
  const q = new URLSearchParams(Object.assign({action, k:KEY}, params||{}));
  const res = body ? await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify(Object.assign({action, k:KEY}, body))})
                   : await fetch(CONFIG.API_URL + '?' + q.toString());
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

/* re-render the item list with a slide animation: every card glides from its old place to its new one,
   and the card that was moved (or added) is highlighted for a moment */
let movedTimer;
function flipRender(focusId){
  const before = {};
  document.querySelectorAll('.pi[data-id]').forEach(el => before[el.dataset.id] = el.getBoundingClientRect().top);
  render();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.pi[data-id]').forEach(el => {
    const id = el.dataset.id, old = before[id];
    if(id === focusId){ el.classList.add(old==null ? 'appear' : 'moved'); clearTimeout(movedTimer); movedTimer = setTimeout(()=>{ const m=document.querySelector('.pi.moved, .pi.appear'); if(m) m.classList.remove('moved','appear'); }, 1400); }
    if(reduce || old==null) return;
    const dy = old - el.getBoundingClientRect().top; if(Math.abs(dy) < 1) return;
    el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition = 'transform .45s cubic-bezier(.2,.7,.2,1), background-color .5s ease, box-shadow .5s ease'; el.style.transform = ''; }));
  });
}
/* search: spelling-tolerant (Thillana = Tillana, Vathapi = Watapi), works on English and Malayalam names, type and ragam */
function norm(s){
  return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9ഀ-ൿ]+/g,'')
    .replace(/w/g,'v').replace(/([tdkgcbpj])h/g,'$1').replace(/sh/g,'s').replace(/zh/g,'l').replace(/ee/g,'i').replace(/oo/g,'u').replace(/(.)\1+/g,'$1');
}
function searchKey(r){ return norm([r.itemEn, r.itemMl, r.typeEn, r.typeMl, r.ragamEn, r.ragamMl, r.composerEn].join(' ')); }
function applySearch(){
  const list=$('#repList'); if(!list || !list.querySelectorAll) return;
  const words=String(state.q||'').trim().split(/\s+/).map(norm).filter(Boolean);
  let shown=0; const rows=list.querySelectorAll('.rr');
  rows.forEach(b=>{ const ok = words.every(w=>b.dataset.k.includes(w)); b.hidden=!ok; if(ok) shown++; });
  list.hidden = shown===0; const nm=$('#noMatch'); if(nm) nm.hidden = shown!==0;
  const c=$('#qCount'); if(c) c.textContent = words.length ? `${shown} of ${rows.length} items` : `${rows.length} items to choose from`;
  const clr=document.querySelector('.search .clr'); if(clr) clr.hidden = !state.q;
}

function details(r, lang){

/* ---------- script PDF: rendered page by page on canvas so Malayalam is shaped correctly ---------- */
function renderScriptPage(s, i, secs){
  const W=1240, H=1754, M=110, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.fillStyle='#FFFFFF'; g.fillRect(0,0,W,H); g.textBaseline='top';
  const INK='#1E1416', MUTED='#6C5A5F', ACC='#8A1B2C', LINE='#E5DAD7';
  const EN=w=>sz=>`${w} ${sz}px Inter, Arial, sans-serif`, ML=w=>sz=>`${w} ${sz}px "Noto Sans Malayalam", Manjari, sans-serif`;
  const P=state.program, maxW=W-2*M;
  const line1=(text,font,size,min,x,y,color,align,w)=>{ const f=fitText(g,text,font,size,min,w||maxW,1,0); g.font=font(f.s); g.fillStyle=color; drawSp(g,f.lines[0]||'',x,y,0,align); };
  // header
  g.textAlign='left'; line1(`${pick('event','en')||'Program'}${P.date ? '  ·  ' + fmtShortDate(P.date) : ''}`, EN(500), 26, 20, M, 62, MUTED, 'left', maxW-240);
  g.font=EN(600)(26); g.fillStyle=MUTED; g.textAlign='right'; g.fillText(`Page ${i+1} of ${secs.length}`, W-M, 62);
  g.fillStyle=LINE; g.fillRect(M,108,maxW,2);
  let y=150;

    c.event && {type:'text', text:c.event, font:F.body, size:body-2, min:20, lines:2, color:col.text, lh, gap:26},
    c.venue && {type:'text', text:c.venue, font:F.body, size:body-5, min:18, lines:3, color:col.muted, lh, gap:6},
    c.org && {type:'text', text:c.org, font:F.body, size:body-10, min:16, lines:2, color:col.muted, lh, gap:18}
  ].filter(Boolean);
}

/* ---- style 1: Temple gold ---- */
function drawGold(ctx,W,H,c,lang,img,adj){
  const sq=W===H, F=STY.gold.fonts[lang], gold='#DDB25A';
  const bg=ctx.createRadialGradient(W*.5,H*.4,40,W*.5,H*.5,Math.hypot(W,H)*.62); bg.addColorStop(0,'#741B2B'); bg.addColorStop(1,'#26070D');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(221,178,90,.07)'; for(let y=70;y<H-60;y+=40) for(let x=70+((y/40)%2)*20;x<W-60;x+=40){ ctx.beginPath(); ctx.arc(x,y,1.8,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle=gold; ctx.lineWidth=5; ctx.strokeRect(30,30,W-60,H-60); ctx.lineWidth=1.6; ctx.strokeRect(46,46,W-92,H-92);
  [[46,46],[W-46,46],[46,H-46],[W-46,H-46]].forEach(([x,y])=>diamond(ctx,x,y,13,gold));
  const A = sq ? {x:88,y:96,w:430,h:888} : {x:170,y:214,w:740,h:1010};
  const info = photoIn(ctx,img,adj,A,'arch');
  ctx.strokeStyle=gold; ctx.lineWidth=4; archPath(ctx,A.x,A.y,A.w,A.h); ctx.stroke();
  ctx.lineWidth=1.5; archPath(ctx,A.x-14,A.y-14,A.w+28,A.h+28); ctx.stroke();
  const col={badgeBg:gold, badgeFg:'#3A0B14', head:'#EAC573', rule:gold, name:'#FFF4E4', text:'#F6E7D4', muted:'#D9C2AC', accent:'#EAC573'};
  if(sq) flow(ctx, blocksFor(c,F,col,lang,{head:44,name:64,body:32,badge:21}), {x:560,y:100,w:452,h:880}, {align:'center'});
  else {
    badge(ctx, measureBlock(ctx,{type:'badge',text:c.badge,font:F.badge,size:26,fg:col.badgeFg,bg:col.badgeBg,upper:lang==='en',spacing:lang==='en'?6:0,ml:lang==='ml'},W,1), W/2, 96, 'center');
    flow(ctx, blocksFor(c,F,col,lang,{noBadge:true,head:56,name:86,body:38}), {x:110,y:1272,w:860,h:560}, {align:'center'});
  }
  return info;
}
/* ---- style 2: Kasavu (Kerala cream and gold border) ---- */
function kasavuBand(ctx,x,y,w,h,vertical){
  const g = vertical ? ctx.createLinearGradient(x,0,x+w,0) : ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#B5852A'); g.addColorStop(.3,'#F2D483'); g.addColorStop(.55,'#C6952F'); g.addColorStop(.8,'#F5DD92'); g.addColorStop(1,'#B5852A');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
}
function drawKasavu(ctx,W,H,c,lang,img,adj){
  const sq=W===H, F=STY.kasavu.fonts[lang];
  ctx.fillStyle='#F5ECD8'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(120,90,40,.035)'; for(let y=0;y<H;y+=5) ctx.fillRect(0,y,W,1.2);
  const ring=(i,w,fill)=>{ ctx.beginPath(); ctx.rect(i,i,W-2*i,H-2*i); ctx.rect(i+w,i+w,W-2*(i+w),H-2*(i+w)); if(typeof fill==='string'){ ctx.fillStyle=fill; ctx.fill('evenodd'); } else { const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#B5852A'); g.addColorStop(.25,'#F2D483'); g.addColorStop(.5,'#C6952F'); g.addColorStop(.75,'#F5DD92'); g.addColorStop(1,'#B5852A'); ctx.fillStyle=g; ctx.fill('evenodd'); } };
  ring(0,24,null); ring(24,6,'#7A1424'); ring(36,4,null);
  const A = sq ? {x:62,y:62,w:470,h:956} : {x:62,y:62,w:956,h:1100};
  const info = photoIn(ctx,img,adj,A,'rect');
  if(sq){ kasavuBand(ctx,A.x+A.w,A.y,14,A.h,true); ctx.fillStyle='#7A1424'; ctx.fillRect(A.x+A.w+14,A.y,4,A.h); }
  else { kasavuBand(ctx,A.x,A.y+A.h,A.w,16,false); ctx.fillStyle='#7A1424'; ctx.fillRect(A.x,A.y+A.h+16,A.w,5); }
  const col={badgeBg:'#7A1424', badgeFg:'#FBEFD8', head:'#7A1424', rule:'#B5852A', name:'#2B1A12', text:'#3A291F', muted:'#6A5444', accent:'#8E6210'};
  if(sq) flow(ctx, blocksFor(c,F,col,lang,{head:40,name:62,body:29,badge:20}), {x:574,y:80,w:448,h:920}, {align:'center'});
  else flow(ctx, blocksFor(c,F,col,lang,{head:52,name:84,body:37,badge:25}), {x:96,y:1214,w:888,h:640}, {align:'center'});
  return info;
}
/* ---- style 3: Simple (full photo) ---- */
function drawMinimal(ctx,W,H,c,lang,img,adj){
  const sq=W===H, F=STY.minimal.fonts[lang];
  const info = photoIn(ctx,img,adj,{x:0,y:0,w:W,h:H},'rect');
  let g=ctx.createLinearGradient(0,H*(sq?.30:.40),0,H); g.addColorStop(0,'rgba(14,8,10,0)'); g.addColorStop(.5,'rgba(14,8,10,.74)'); g.addColorStop(1,'rgba(14,8,10,.94)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createLinearGradient(0,0,0,H*.2); g.addColorStop(0,'rgba(14,8,10,.55)'); g.addColorStop(1,'rgba(14,8,10,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*.2);
  const col={badgeStroke:'rgba(255,255,255,.92)', badgeFg:'#FFFFFF', head:'#F2C46B', rule:'#F2C46B', name:'#FFFFFF', text:'rgba(255,255,255,.93)', muted:'rgba(255,255,255,.76)', accent:'#F2C46B'};
  badge(ctx, measureBlock(ctx,{type:'badge',text:c.badge,font:F.badge,size:sq?24:28,fg:col.badgeFg,stroke:col.badgeStroke,upper:lang==='en',spacing:lang==='en'?5:0,ml:lang==='ml'},W,1), 70, sq?66:110, 'left');
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=12;
  const R = sq ? {x:70,y:H*.38,w:W-140,h:H*.62-66} : {x:80,y:H*.48,w:W-160,h:H*.52-120};
  flow(ctx, blocksFor(c,F,col,lang,{noBadge:true, head:sq?26:30, headUpper:true, headSpacing:6, name:sq?74:96, body:sq?30:37, divider:'line'}), R, {align:'left', valign:'bottom'});
  ctx.restore();
  return info;
}

function renderPoster(canvas, stage, size, scale, lang){
  lang = lang==='ml' ? 'ml' : 'en';
  const S=SIZES[size], W=S.w, H=S.h; canvas.width=Math.round(W*scale); canvas.height=Math.round(H*scale);
  const ctx=canvas.getContext('2d'); ctx.setTransform(scale,0,0,scale,0,0); ctx.textBaseline='top';
  const p=activePhoto();
  return STY[state.pStyle].draw(ctx, W, H, posterText(stage, lang), lang, p && p.img, getAdj(p && p.id, size));
}

/* the four posters of one stage, in carousel order */
const POSTER_SET = [{lang:'en', size:'sq'}, {lang:'en', size:'story'}, {lang:'ml', size:'sq'}, {lang:'ml', size:'story'}];
function posterCarousel(s){
  return `<div class="stage">
      <div class="stage-h"><b>${s.label}</b><span>${s.when}</span></div>
      <div class="car" data-car="${s.id}" role="group" aria-label="${s.label} posters, swipe for more">
        ${POSTER_SET.map(x=>thumbHTML(s, x.size, x.lang)).join('')}
      </div>
      <div class="dots" data-dots="${s.id}">${POSTER_SET.map((x,i)=>`<button data-act="cardot" data-car="${s.id}" data-i="${i}" aria-label="Show ${x.lang==='ml'?'Malayalam':'English'} ${x.size==='sq'?'post':'story'}" aria-current="${i===0}"></button>`).join('')}</div>
    </div>`;
}
/* keep the dots under a carousel in step with where it has been swiped to */
function carIndex(car){ const items=[...car.children], x=car.scrollLeft; let best=0, d=Infinity;
  items.forEach((el,i)=>{ const dd=Math.abs(el.offsetLeft - car.firstElementChild.offsetLeft - x); if(dd<d){ d=dd; best=i; } });
  if(car.scrollLeft + car.clientWidth >= car.scrollWidth - 2) best = items.length-1;
  return best; }
document.addEventListener('scroll', e=>{ const car=e.target; if(!car.dataset || !car.dataset.car) return;
  const i=carIndex(car); document.querySelectorAll(`[data-dots="${car.dataset.car}"] button`).forEach((b,j)=>b.setAttribute('aria-current', String(i===j))); }, true);

function postersPanel(){
  const p = activePhoto(), hasMine = photos.some(x=>x.kind==='mine' || x.kind==='drive');
  return `
  <div class="ctl"><span class="lbl">Style</span>
    <div class="seg" role="group" aria-label="Poster style">
      ${Object.entries(STY).map(([k,s])=>`<button data-act="pstyle" data-v="${k}" aria-pressed="${state.pStyle===k}">${s.label}</button>`).join('')}
    </div></div>
  <div class="ctl"><span class="lbl">Photo</span>
    <div class="photos">
      <button class="ph add" data-act="addphoto">${ICON.cam}<span>Add photo</span></button>
      ${photos.map(x=>`<button class="ph" data-act="photo" data-id="${esc(x.id)}" aria-pressed="${p && p.id===x.id}" aria-label="${esc(x.name)}">${x.thumb ? `<img src="${esc(x.thumb)}" alt="">` : ''}${x.kind==='mine' ? `<span class="x" data-act="delphoto" data-id="${esc(x.id)}" aria-label="Remove photo">×</span>` : ''}</button>`).join('')}
    </div>
    ${hasMine ? '' : `<p class="hint">These are placeholder pictures. Tap <b>Add photo</b> to try one of her real photos from the phone.</p>`}
  </div>
  ${STAGES.map(posterCarousel).join('')}
  <p class="hint">Swipe sideways to see the English and Malayalam posters. Tap a poster to see it large, move the photo, and save or share it.</p>`;
}
/* one poster thumbnail: tap the picture to preview; tap the round icon to save or share it straight away */
function thumbHTML(s, size, lang){
  const lbl = size==='sq' ? 'Post' : 'Story', ln = lang==='ml' ? 'Malayalam' : 'English', d = `data-stage="${s.id}" data-size="${size}" data-lang="${lang}"`;
  return `<div class="tw ${size}"><button class="thumb" data-act="open" ${d} aria-label="Preview ${s.label}, ${ln} ${size==='sq'?'square post':'story'}"><canvas ${d}></canvas><span class="cap">${lang==='ml'?'മലയാളം':'English'} · ${lbl}</span></button><button class="dl" data-act="dlposter" ${d} aria-label="Save or share ${s.label} ${ln} ${lbl.toLowerCase()}" title="Save or share">${ICON.share}</button></div>`;
}
function posterDownloadName(stage, size, lang){
  const slug = (pick('event','en')||'program').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'program';
  return `${slug}-${stage}-${size==='sq'?'post':'story'}-${lang==='ml'?'malayalam':'english'}.jpg`;
}
function dataUrlToBlob(u){ const [h,b]=u.split(','), bin=atob(b), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'}); }
/* made without waiting, so the iPhone share sheet still counts it as part of the tap */
function downloadPoster(stage, size, lang, btn){
  const cv = document.createElement('canvas'); renderPoster(cv, stage, size, 1, lang);
  const blob = dataUrlToBlob(cv.toDataURL('image/jpeg', .92));
  if(btn) btn.disabled = true;
  shareFile(blob, posterDownloadName(stage, size, lang), 'Open the poster and press and hold it, then tap Save to Photos.').finally(()=>{ if(btn) btn.disabled = false; });
}
let drawToken = 0;
async function drawThumbs(){
  const my = ++drawToken; await ensureFonts(); const p=activePhoto(); if(p) await ensurePhotoImg(p);
  if(my!==drawToken) return;
  document.querySelectorAll('.thumb canvas').forEach(cv=>{ const sz=cv.dataset.size; renderPoster(cv, cv.dataset.stage, sz, sz==='sq' ? .42 : .3, cv.dataset.lang); });
}

/* ---- viewer: on the Posters step you can also move the photo; on Review it only shows the poster ---- */
const V = {stage:null, size:null, lang:'en', view:false, adjusting:false, info:null, drag:null};
async function openViewer(stage, size, lang){
  V.stage=stage; V.size=size; V.lang=lang==='ml'?'ml':'en'; V.view = state.step!==3; V.adjusting=false;
  $('#vTitle').textContent = `${STAGES.find(s=>s.id===stage).label} · ${V.lang==='ml'?'Malayalam':'English'} ${SIZES[size].label.toLowerCase()}`;
  $('#vClose').textContent = V.view ? 'Close' : 'Done';
  $('#viewer').hidden=false; document.body.style.overflow='hidden';
  await ensureFonts(); drawViewer(true); vTools();
}
function drawViewer(updateImg){
  const cv=$('#vCanvas'); V.info = renderPoster(cv, V.stage, V.size, 1, V.lang);
  if(updateImg){ $('#vImg').src = cv.toDataURL('image/jpeg', .9); }
  $('#vImg').hidden = V.adjusting; cv.hidden = !V.adjusting; $('#vMove').hidden = V.adjusting || V.view;
}
function vTools(){
  const a=getAdj(activePhoto() && activePhoto().id, V.size);
  $('#vTools').innerHTML = V.adjusting ? `
    <p class="hint"><b>Drag the poster</b> with your finger to move the photo. Use the slider to make the photo bigger.</p>
    <div class="zoom"><span class="muted">Smaller</span><input id="vZoom" type="range" min="1" max="2.5" step="0.05" value="${a.z||1}" aria-label="Photo size"><span class="muted">Bigger</span></div>
    <div class="btn-row"><button class="btn secondary" data-act="vreset">Reset</button><button class="btn" data-act="vdoneadj">Done moving</button></div>`
  : '';
}
function closeViewer(){ $('#viewer').hidden=true; document.body.style.overflow=''; save(); if(state.step===3 && !V.view) drawThumbs(); }
function bindViewerDrag(){
  const cv=$('#vCanvas');
  cv.addEventListener('pointerdown', e=>{ if(!V.adjusting) return; cv.setPointerCapture(e.pointerId); V.drag={x:e.clientX, y:e.clientY}; e.preventDefault(); });
  cv.addEventListener('pointermove', e=>{
    if(!V.drag) return; const r=cv.getBoundingClientRect(), k=cv.width/r.width;
    const dx=(e.clientX-V.drag.x)*k, dy=(e.clientY-V.drag.y)*k; V.drag={x:e.clientX, y:e.clientY};
    const p=activePhoto(), a=Object.assign({}, getAdj(p&&p.id, V.size));
    if(V.info && V.info.ox>0) a.fx = clamp(a.fx - dx/V.info.ox, 0, 1);
    if(V.info && V.info.oy>0) a.fy = clamp(a.fy - dy/V.info.oy, 0, 1);
    setAdj(p&&p.id, V.size, a);
    if(!V.raf) V.raf = requestAnimationFrame(()=>{ V.raf=null; drawViewer(false); });
  });
  const end=()=>{ V.drag=null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  document.addEventListener('input', e=>{ if(e.target.id==='vZoom'){ const p=activePhoto(), a=Object.assign({}, getAdj(p&&p.id, V.size)); a.z=+e.target.value; setAdj(p&&p.id, V.size, a); drawViewer(false); } });
}

/* ================================================================
   EVENTS
   ================================================================ */
function disarm(){ if(state.clearArm){ state.clearArm=false; } }
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, i=+b.dataset.i;
  if(act!=='clear' && act!=='newprog') disarm();
  switch(act){
    case 'go': { if(state.saving) break; const s=+b.dataset.step; if(s>1 && !validItems().length){ state.step=1; toast('Add at least one item first'); } else state.step=s; save(); render(); window.scrollTo(0,0); break; }
    case 'add': { const r=rep(b.dataset.id); state.items.push({id:b.dataset.id, len:'short'}); state.q=''; save(); flipRender(b.dataset.id); toast(`Added as item ${validItems().length}: ${r ? r.itemEn : ''}`); break; }
    case 'clearq': state.q=''; { const q=$('#q'); if(q){ q.value=''; q.focus(); } } applySearch(); break;
    case 'remove': { state.items = validItems(); const gone=state.items[i]; if(!gone) break; const r=rep(gone.id); const card=b.closest('.pi');
      const finish=()=>{ state.items.splice(state.items.indexOf(gone),1); save(); flipRender(null); toast(`Removed ${r ? r.itemEn : 'item'}`); };
      if(card && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){ card.classList.add('leaving'); setTimeout(finish, 240); } else finish();
      break; }
    case 'up': case 'down': { state.items = validItems(); const j = act==='up' ? i-1 : i+1; if(j<0||j>=state.items.length) break; const mv=state.items[i];
      [state.items[i], state.items[j]] = [state.items[j], state.items[i]]; save(); flipRender(mv.id);
      const r=rep(mv.id); toast(`${r ? r.itemEn : 'Item'} is now item ${j+1}`);
      const btn = document.querySelector(`[data-act="${act}"][data-i="${j}"]`); if(btn && !btn.disabled) btn.focus({preventScroll:true}); break; }
    case 'clear': if(!state.clearArm){ state.clearArm=true; render(); } else { state.clearArm=false; state.program=blankProgram(); state.folder=null; state.pdf=null; save(); render(); toast('Details cleared'); } break;
    case 'newprog': state.program=blankProgram(); state.items=[]; state.folder=null; state.pdf=null; state.edits={}; state.editsSig=''; state.q=''; state.step=1; render(); window.scrollTo(0,0); toast('Ready for a new program'); break;
    case 'saveall': saveAll(); break;
    case 'copy-folder': copyText(state.folder ? state.folder.url : ''); break;
    case 'wa-folder': break;
    case 'slang': state.scriptLang=b.dataset.v; save(); render(); break;
    case 'biolen': state.bioLen=b.dataset.v; delete state.edits['intro|en']; delete state.edits['intro|ml']; save(); refreshScript(); break;
    case 'len': { const it=validItems()[i]; if(it){ it.len=b.dataset.v; state.items=validItems(); delete state.edits['item-'+it.id+'|en']; delete state.edits['item-'+it.id+'|ml']; state.editsSig=sig(); save(); refreshScript(); } break; }
    case 'page': openPage(i, false); break;
    case 'pageview': openPage(i, true); break;
    case 'pclose': closePage(); break;
    case 'pprev': PV.i--; drawPage(true); break;
    case 'pnext': PV.i++; drawPage(true); break;
    case 'cardot': { const car=document.querySelector(`.car[data-car="${b.dataset.car}"]`), el=car && car.children[i];
      if(el) car.scrollTo({left: el.offsetLeft - car.firstElementChild.offsetLeft, behavior:'smooth'}); break; }
    case 'pundo': { const s=buildSections()[PV.i]; if(s){ delete state.edits[s.id+'|en']; delete state.edits[s.id+'|ml']; save(); drawPage(true); toast('Back to the original words'); } break; }
    case 'wa-script': b.href = waHref(scriptText()); break;
    case 'pdf': downloadScriptPdf(b); break;
    case 'pstyle': state.pStyle=b.dataset.v; save(); rerenderPanel(); break;
    case 'photo': if(e.target.closest('.x')) break; state.photoId=b.dataset.id; save(); rerenderPanel(); break;
    case 'delphoto': { e.stopPropagation(); const id=b.dataset.id; const idx=photos.findIndex(p=>p.id===id); if(idx>=0) photos.splice(idx,1); IDB.del(id); if(state.photoId===id) state.photoId=null; save(); rerenderPanel(); toast('Photo removed from this phone'); break; }
    case 'addphoto': $('#fileIn').click(); break;
    case 'open': openViewer(b.dataset.stage, b.dataset.size, b.dataset.lang); break;
    case 'vclose': closeViewer(); break;
    case 'dlposter': downloadPoster(b.dataset.stage, b.dataset.size, b.dataset.lang, b); break;
    case 'vadjust': V.adjusting=true; drawViewer(false); vTools(); break;
    case 'vdoneadj': V.adjusting=false; drawViewer(true); vTools(); save(); break;
    case 'vreset': { const p=activePhoto(); delete state.adjust[(p?p.id:'none')+'|'+V.size]; drawViewer(false); vTools(); break; }
    case 'retry': boot(); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ state.q=e.target.value; applySearch(); return; }
  const f=e.target.dataset && e.target.dataset.field;
  if(f){ state.program[f]=e.target.value; state.folder=null; state.pdf=null; save(); return; }
  const k=e.target.dataset && e.target.dataset.edit;
  if(k){ state.edits[k]=e.target.value; autosize(e.target); save();
    if(pageOpen()){ clearTimeout(PV.t); PV.t=setTimeout(()=>drawPage(false), 350); } }
});
$('#fileIn').addEventListener('change', e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length) addPhotoFiles(fs); });
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(!$('#viewer').hidden) closeViewer(); else if(pageOpen()) closePage(); });
window.addEventListener('resize', ()=>document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px'));
// ask before leaving while the Drive save is still running
window.addEventListener('beforeunload', e=>{ if(state.saving){ e.preventDefault(); e.returnValue=''; } });

/* ================================================================
   START
   ================================================================ */
let loadError = '';
async function boot(){
  loadError=''; render();
  if(LIVE){
    if(!KEY){ loadError='This link is missing its access code. Ask your helper for the full link and add it to the Home Screen again.'; render(); return; }
    try{
      const j = await api('data');
      DATA = {repertoire:j.repertoire||[], text:j.text||{}, photos:j.photos||[]};
      photos.length = 0;
      (DATA.photos||[]).forEach(ph=>photos.push({id:'drive-'+ph.id, driveId:ph.id, name:ph.name, kind:'drive', img:null, thumb:null}));
      await loadMyPhotos();
      render();
      photos.filter(p=>p.kind==='drive').forEach(p=>ensurePhotoImg(p).then(()=>{ if(state.step>=3) render(); }));
      syncMyPhotos();
    }catch(e){ loadError = 'Check the internet connection and try again. (' + e.message + ')'; render(); }
  } else {
    if(!photos.length) initSamplePhotos();
    await loadMyPhotos();
    render();
  }
}
bindViewerDrag();
boot();
})();
</script>
